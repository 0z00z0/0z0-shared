name: Run the tests
description: >-
  Runs the guards of the modules named, of every module when none is, or every test when asked.
  Reached only from the CI workflow's manual trigger: nothing runs it on a push, a pull request or
  a tag.

inputs:
  configuration:
    description: The configuration the solution was built in.
    required: false
    default: Release
  modules:
    description: Component keys separated by spaces, as in "mqtt config". Empty runs every module.
    required: false
    default: ""
  full:
    description: Every test of the selected modules rather than their guards.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Each test project is invoked by name rather than through the solution: the solution also holds
    # the interactive harness, a WinUI application whose Windows App SDK bootstrapper blocks on a
    # runner with no desktop session. Every test project is plain net10.0 and references only plain
    # net10.0 libraries, so no test assembly loads that bootstrapper; the tray tests start the harness
    # as a child process, and skip where the Windows App Runtime is not registered for the user, so a
    # runner without it never starts the bootstrapper either. Some tests bind a loopback TcpListener
    # and speak MQTT to it, so the runner needs nothing beyond the loopback interface — no broker,
    # and no outbound network.
    - name: Tests
      shell: pwsh
      env:
        CONFIGURATION: ${{ inputs.configuration }}
        MODULES: ${{ inputs.modules }}
        FULL: ${{ inputs.full }}
      run: |
        $arguments = @("-Configuration", $env:CONFIGURATION)
        if ("$env:MODULES".Trim()) { $arguments += @("-Module", "$env:MODULES".Trim()) } else { $arguments += "-AllModules" }
        if ($env:FULL -eq "true") { $arguments += "-Full" }
        ./.github/scripts/run-tests.ps1 @arguments
