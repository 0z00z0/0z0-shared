name: CI

# A push or a pull request builds the solution and runs no test. Tests run when someone asks for
# them through the manual trigger: the guards of the modules named, or of every module when none is,
# or every test when "full" is ticked. docs/testing.md says what a guards run leaves unproved.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      modules:
        description: Component keys separated by spaces, as in "mqtt config". Empty runs every module.
        type: string
        required: false
        default: ""
      full:
        description: Every test instead of the guards.
        type: boolean
        required: false
        default: false

jobs:
  build:
    # The WinUI projects target net10.0-windows and need the Windows App SDK build tooling.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # An exact SDK version makes the install script download from its release feed. A channel
      # such as 10.0.x resolves through an aka.ms redirect to a storage origin that can fail on its
      # own, with no fallback to the feed. The same line sits in release.yml.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.403"

      - name: Restore
        run: dotnet restore 0z0-shared.slnx

      - name: Build
        run: dotnet build 0z0-shared.slnx -c Release --no-restore

      # The one test-run definition, the same script a local run uses. It discovers every project
      # under tests/ when it runs, so a new test project joins its module the moment it exists, and
      # it fails at the end naming every project that failed.
      - name: Tests
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/run-tests
        with:
          modules: ${{ inputs.modules }}
          full: ${{ inputs.full }}
