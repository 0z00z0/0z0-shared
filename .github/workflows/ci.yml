name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # The WinUI projects target net10.0-windows and need the Windows App SDK build tooling.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore 0z0-shared.slnx

      - name: Build
        run: dotnet build 0z0-shared.slnx -c Release --no-restore

      # The one test-run definition, shared with the release workflow. It discovers every project
      # under tests/ when it runs, so a new test project is in the run the moment it exists, and it
      # fails at the end naming every project that failed. A hand-written step per project was the
      # alternative, and a forgotten step is a project whose tests never run while everything stays
      # green.
      - name: Unit tests
        uses: ./.github/actions/run-tests
