name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # ZeroZero.Brand.WinUI targets net10.0-windows and needs the Windows App SDK build tooling.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore 0z0-shared.slnx

      - name: Build
        run: dotnet build 0z0-shared.slnx -c Release --no-restore

      # Each test project is invoked by name rather than through the solution: the solution also
      # holds ZeroZero.Brand.WinUI.TestHarness, a WinUI application whose Windows App SDK
      # bootstrapper blocks on a runner with no desktop session. Both test projects are plain
      # net10.0 and reference only plain net10.0 libraries, so neither can reach that bootstrapper.
      # One step per project: a single step would report only the last exit code.
      - name: Unit tests — ZeroZero.Brand.Core
        run: dotnet test tests\ZeroZero.Brand.Core.Tests\ZeroZero.Brand.Core.Tests.csproj -c Release --no-build --nologo

      - name: Unit tests — ZeroZero.Config
        run: dotnet test tests\ZeroZero.Config.Tests\ZeroZero.Config.Tests.csproj -c Release --no-build --nologo

      # Some of these bind a loopback TcpListener and speak MQTT to it, so the runner needs nothing
      # beyond the loopback interface — no broker, and no outbound network.
      - name: Unit tests — ZeroZero.Mqtt
        run: dotnet test tests\ZeroZero.Mqtt.Tests\ZeroZero.Mqtt.Tests.csproj -c Release --no-build --nologo

      # Drives the same loopback listener, one layer up.
      - name: Unit tests — ZeroZero.Mqtt.Discovery
        run: dotnet test tests\ZeroZero.Mqtt.Discovery.Tests\ZeroZero.Mqtt.Discovery.Tests.csproj -c Release --no-build --nologo
