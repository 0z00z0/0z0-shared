name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # ZeroZero.Brand.WinUI targets net10.0-windows and needs the Windows App SDK build tooling.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore 0z0-shared.slnx

      - name: Build
        run: dotnet build 0z0-shared.slnx -c Release --no-restore

      # Invoked against the test csproj, not the solution: the solution also holds
      # ZeroZero.Brand.WinUI.TestHarness, a WinUI application whose Windows App SDK bootstrapper
      # blocks on a runner with no desktop session. ZeroZero.Brand.Core.Tests is plain net10.0 and
      # references only ZeroZero.Brand.Core, so nothing here can reach that bootstrapper.
      - name: Unit tests
        run: dotnet test tests\ZeroZero.Brand.Core.Tests\ZeroZero.Brand.Core.Tests.csproj -c Release --no-build --nologo
