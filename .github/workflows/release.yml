name: Release

on:
  push:
    # A release tag names one component: <key>-v<x.y.z>, as in mqtt-v0.7.0. The bare v* pattern
    # stays so that a tag in the older single-number form fails the first guard loudly instead of
    # matching no workflow and publishing nothing in silence.
    tags: ["*-v*", "v*"]

permissions:
  # gh release create writes to the repository.
  contents: write
  # The package push below. That is the whole credential story: GITHUB_TOKEN is minted for the run,
  # so there is no secret to create, rotate or forget.
  packages: write

jobs:
  release:
    # The WinUI projects target net10.0-windows and need the Windows App SDK build tooling.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # The tag's prefix is the component key — the first segment of the assembly name after
      # ZeroZero., lower-cased — and it selects the projects, the notes file and the version
      # property for everything below. A tag naming no component, or one Versions.props does not
      # declare, stops here. The guards are scripts rather than inline steps so they can be run,
      # and made to fail, on a developer's machine.
      - name: Tag names a component
        id: component
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./.github/scripts/release-guard.ps1 -Tag $env:TAG -Check Tag

      # Notes are written per tag and committed beside the code. A generated commit list does not
      # tell a consumer whether a pin bump is a breaking one, so an absent file fails the release
      # rather than falling back to one. Checked before the build so the fix costs seconds.
      - name: Release notes present
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./.github/scripts/release-guard.ps1 -Tag $env:TAG -Check Notes

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore 0z0-shared.slnx

      # A tag that disagrees with the declared version surfaces only in a consumer, long after the
      # release. Every packable project of the component is evaluated, so a per-project override of
      # the component's version is caught as well as a mistyped tag. Runs after restore because
      # MSBuild evaluation imports the restore-generated files.
      - name: Tag matches the declared version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./.github/scripts/release-guard.ps1 -Tag $env:TAG -Check Versions

      # Packing turns a project reference on another component into a package dependency on that
      # component's declared version, so that version has to be on the feed already. The check is
      # against the remote's tags: a component with unreleased changes releases first, under its
      # own tag and its own notes.
      - name: Referenced components are released
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./.github/scripts/release-guard.ps1 -Tag $env:TAG -Check Dependencies

      - name: Build
        run: dotnet build 0z0-shared.slnx -c Release --no-restore

      # The whole suite, not only the component's: the same definition CI uses, and a release cut
      # from a red build is worse than no release.
      - name: Unit tests
        uses: ./.github/actions/run-tests

      # Only the component's projects pack, both WinUI assemblies included where the component has
      # them: their packages carry the compiled XAML and the .pri index beside the assembly, and a
      # consuming build merges that index into its own. No -p:Version — the version comes from
      # Versions.props, which the guard above has already checked against the tag, so there is one
      # declaration and not two. The script fails unless exactly the expected packages landed.
      - name: Pack the component
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./.github/scripts/pack-component.ps1 -Tag $env:TAG -Output artifacts

      # GitHub Packages is the only feed these packages go to. nuget.org is not a fallback and not a
      # later step. This job is the only publish path, so keep it the only place a source is named.
      #
      # GITHUB_TOKEN, not a PAT: it is minted per run, so there is no secret to create, rotate or
      # forget, and nothing that expires and breaks a release with no warning. It buys nothing for a
      # consumer either — a restore happens against the consumer's own NuGet.Config, never here.
      #
      # --no-symbols: pack writes a .snupkg beside each .nupkg and push would send it uninvited.
      # GitHub Packages has no symbol server, so that is a failed step in exchange for nothing.
      #
      # No --skip-duplicate. It turns the 409 that means "this version is already published" into a
      # green build while the old bits stay live, which is the one failure a release job exists to
      # catch.
      #
      # Before the release is created, so a published release means the packages are actually on the
      # feed rather than merely announced there.
      #
      # One push per file rather than a wildcard: dotnet nuget push does not expand a wildcard here
      # and reports "File does not exist" against packages that are sitting in the folder. The loop
      # stops on the first failure, so a partial publish is a red build and not a green one.
      - name: Push to GitHub Packages
        shell: pwsh
        env:
          FEED: https://nuget.pkg.github.com/0z00z0/index.json
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packages = Get-ChildItem artifacts -Filter *.nupkg
          if ($packages.Count -eq 0) {
            Write-Host "::error::Nothing to push: artifacts holds no .nupkg."
            exit 1
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:TOKEN --source $env:FEED --no-symbols
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # No artefact is attached: the packages are the artefact and they live on the feed, so a copy
      # on the release page would be a second thing to keep honest. The release is the tag, its
      # notes and the component's packages the step above published.
      - name: Create the release
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          KEY: ${{ steps.component.outputs.key }}
          VERSION: ${{ steps.component.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG --title $env:TAG --notes-file "docs/release-notes/$env:KEY/v$env:VERSION.md"
