name: Release

on:
  push:
    tags: ["v*"]

permissions:
  # gh release create writes to the repository.
  contents: write
  # The package push below. That is the whole credential story: GITHUB_TOKEN is minted for the run,
  # so there is no secret to create, rotate or forget.
  packages: write

jobs:
  release:
    # ZeroZero.Brand.WinUI targets net10.0-windows and needs the Windows App SDK build tooling.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Notes are written per tag and committed beside the code. A generated commit list does not
      # tell a consumer whether a pin bump is a breaking one, so an absent file fails the release
      # rather than falling back to one. Checked before the build so the fix costs seconds.
      - name: Release notes present
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $notes = "docs/release-notes/$env:TAG.md"
          if (-not (Test-Path $notes)) {
            Write-Host "::error::$notes is missing. Write the release notes, then retag."
            exit 1
          }
          Write-Host "Found $notes."

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore 0z0-shared.slnx

      # A tag that disagrees with the declared version surfaces only in a consumer, long after the
      # release. Every project under src/ is evaluated, so a per-project override of the shared
      # Version is caught as well as a mistyped tag. Runs after restore because MSBuild evaluation
      # imports the restore-generated files.
      - name: Tag matches the declared version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $expected = $env:TAG.TrimStart("v")
          $mismatch = $false
          foreach ($project in Get-ChildItem src -Recurse -Filter *.csproj) {
            $declared = (dotnet msbuild $project.FullName -getProperty:Version).Trim()
            if ($declared -ne $expected) {
              Write-Host "::error::$($project.Name) declares '$declared', the tag says '$expected'."
              $mismatch = $true
            }
          }
          if ($mismatch) { exit 1 }
          Write-Host "Every project declares $expected."

      - name: Build
        run: dotnet build 0z0-shared.slnx -c Release --no-restore

      # Same four steps as CI, and for the same reasons: the solution also holds
      # ZeroZero.Brand.WinUI.TestHarness, a WinUI application whose Windows App SDK bootstrapper
      # blocks on a runner with no desktop session, and a single step would report only the last
      # exit code. The release is gated on all four — a release cut from a red build is worse than
      # no release.
      - name: Unit tests — ZeroZero.Brand.Core
        run: dotnet test tests\ZeroZero.Brand.Core.Tests\ZeroZero.Brand.Core.Tests.csproj -c Release --no-build --nologo

      - name: Unit tests — ZeroZero.Config
        run: dotnet test tests\ZeroZero.Config.Tests\ZeroZero.Config.Tests.csproj -c Release --no-build --nologo

      - name: Unit tests — ZeroZero.Mqtt
        run: dotnet test tests\ZeroZero.Mqtt.Tests\ZeroZero.Mqtt.Tests.csproj -c Release --no-build --nologo

      - name: Unit tests — ZeroZero.Mqtt.Discovery
        run: dotnet test tests\ZeroZero.Mqtt.Discovery.Tests\ZeroZero.Mqtt.Discovery.Tests.csproj -c Release --no-build --nologo

      # All six libraries pack, both WinUI assemblies included: their packages carry the compiled
      # XAML and the .pri index beside the assembly, and a consuming build merges that index into
      # its own. No -p:Version — the version comes from Directory.Build.props, which the step above
      # has already checked against the tag, so there is one declaration and not two.
      - name: Pack
        run: dotnet pack 0z0-shared.slnx -c Release --no-build -o artifacts

      # GitHub Packages is the only feed these packages go to. nuget.org is not a fallback and not a
      # later step. This job is the only publish path, so keep it the only place a source is named.
      #
      # GITHUB_TOKEN, not a PAT: it is minted per run, so there is no secret to create, rotate or
      # forget, and nothing that expires and breaks a release with no warning. It buys nothing for a
      # consumer either — a restore happens against the consumer's own NuGet.Config, never here.
      #
      # --no-symbols: pack writes a .snupkg beside each .nupkg and push would send it uninvited.
      # GitHub Packages has no symbol server, so that is a failed step in exchange for nothing.
      #
      # No --skip-duplicate. It turns the 409 that means "this version is already published" into a
      # green build while the old bits stay live, which is the one failure a release job exists to
      # catch.
      #
      # Before the release is created, so a published release means the packages are actually on the
      # feed rather than merely announced there.
      #
      # One push per file rather than a wildcard: dotnet nuget push does not expand a wildcard here
      # and reports "File does not exist" against packages that are sitting in the folder. The loop
      # stops on the first failure, so a partial publish is a red build and not a green one.
      - name: Push to GitHub Packages
        shell: pwsh
        env:
          FEED: https://nuget.pkg.github.com/0z00z0/index.json
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packages = Get-ChildItem artifacts -Filter *.nupkg
          if ($packages.Count -eq 0) {
            Write-Host "::error::Nothing to push: artifacts holds no .nupkg."
            exit 1
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:TOKEN --source $env:FEED --no-symbols
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # No artefact is attached: the packages are the artefact and they live on the feed, so a copy
      # on the release page would be a second thing to keep honest. The release is the tag, its
      # notes and the six packages the step above published.
      - name: Create the release
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG --title $env:TAG --notes-file "docs/release-notes/$env:TAG.md"
