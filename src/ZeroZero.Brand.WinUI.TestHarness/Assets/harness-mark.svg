<?xml version="1.0" encoding="utf-8"?>
<!-- A two-tone mark for the rig's navigation icons and pane footer: a rounded square in the
     accent tone with a lighter ring inside it, so the 28-unit icon box is visibly filled. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <rect x="1" y="1" width="26" height="26" rx="6" fill="#2B6CB0"/>
  <circle cx="14" cy="14" r="7" fill="none" stroke="#BEE3F8" stroke-width="3"/>
  <circle cx="14" cy="14" r="2" fill="#BEE3F8"/>
</svg>
